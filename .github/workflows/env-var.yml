name: environment variables
on:
  workflow_dispatch:
env:
  APP_NAME: myapp
jobs:
  print-envs:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
    steps:
      - name: print all levels of environments
        env:
          VERSION: 1.0.0
        run: |
          echo " App-name: $APP_NAME"
          echo " Environment: $ENVIRONMENT"
          echo " app-version: $VERSION"
          
